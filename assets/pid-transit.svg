<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#16222e"/>
    </linearGradient>
  </defs>
  <rect width="620" height="400" fill="url(#bg)"/>

  <!-- transit route lines -->
  <polyline points="50,330 170,240 320,260 470,140 570,100" fill="none" stroke="#7fb3d5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="60,110 200,150 350,95 500,190 575,255" fill="none" stroke="#c5c5c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <polyline points="90,360 240,320 400,335 545,300" fill="none" stroke="#88a898" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- stops -->
  <g fill="#EAEAEA" stroke="#2c3e50" stroke-width="3">
    <circle cx="170" cy="240" r="9"/>
    <circle cx="320" cy="260" r="9"/>
    <circle cx="470" cy="140" r="9"/>
    <circle cx="200" cy="150" r="8"/>
    <circle cx="350" cy="95" r="8"/>
    <circle cx="500" cy="190" r="8"/>
    <circle cx="240" cy="320" r="7"/>
    <circle cx="400" cy="335" r="7"/>
  </g>

  <!-- interchange node -->
  <circle cx="320" cy="260" r="15" fill="none" stroke="#7fb3d5" stroke-width="3" opacity="0.8"/>

  <!-- label -->
  <text x="310" y="55" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" fill="#EAEAEA">GTFS ⇄ NeTEx</text>
</svg>
